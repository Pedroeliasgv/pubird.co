<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"

    <link

    <link

      content="https://pubird.com.br/"

      content="summary_large_image"

      name="twitter:title"

    />

    <meta
      name="twitter:description"

      content="https://pubird.com.br/og-image.jpg"

      name="theme-color"
